name: CI

on:
  push:
    branches:
      - main
      - develop
  # PR スタック（feature ブランチを base にした PR）でも CI を走らせるため
  # base ブランチを限定しない。限定すると develop/main 直行の PR 以外が
  # 型チェックもビルドも検証されないままマージ順に流れる。
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI は読むだけ。リポジトリ既定が read でも、設定変更ひとつで消える防御なので
# ワークフロー側で明示する。
permissions:
  contents: read

jobs:
  # ============================================
  # コード品質チェック
  # ============================================
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. 依存関係のインストール
      - name: Install dependencies
        run: npm ci

      # 4. ESLintチェック
      - name: Run ESLint
        run: npm run lint

      # 5. Biomeフォーマットチェック
      - name: Check code formatting (Biome)
        run: npm run format:check

      # 6. TypeScript型チェック
      - name: Run TypeScript type check
        run: npm run type-check

      # 7. ユニットテスト（Vitest）
      - name: Run unit tests
        run: npm run test

      # 8. ワークフローの静的検査（actionlint）
      # 消した step id や書き間違えた式はエラーにならず空文字に評価され、
      # deploy.yml は main に上がるまで走らないので本番で初めて表に出る（#199）。
      # ランナーの shellcheck で run: の中身も検査される。ただし shellcheck が
      # 無いと actionlint はその規則を黙って外して exit 0 になり、検知が半分に
      # 落ちる。版をログに出すついでに、消えたらここで落とす。
      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          shellcheck --version
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint

  # ============================================
  # ビルド検証
  # ============================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-check # 品質チェック通過後に実行

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. 依存関係のインストール
      - name: Install dependencies
        run: npm ci

      # 4. 環境変数のセットアップ（ビルド用）
      - name: Setup environment variables for build
        run: cp .env.example .env

      # 5. Prisma Clientの生成（ビルド前に必要）
      - name: Generate Prisma Client
        run: npx prisma generate

      # 6. Next.jsビルド
      - name: Build Next.js application
        run: npm run build

  # ============================================
  # k8sマニフェスト検証
  # ============================================
  # overlays/local を消したことで PR 時点の検証手段が減ったため、
  # クラスタ不要の静的検証を入れる。
  manifests:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # バージョンは固定する。master / latest 参照だと上流の更新だけで
      # CI が赤にも緑にも変わり、失敗の原因を差分から追えなくなる。
      # curl は -f を付ける（付けないと 404 本文を取得して exit 0 になる）。
      # *_SHA256 は各リリースが公開しているチェックサムファイルの linux amd64 の値で、
      # 展開前に照合する。版を上げるときは一緒に書き換える（#164）。
      #
      # 上流の install_kustomize.sh は使わない。あれはダウンロード URL を
      # 解決するために GitHub の releases API を未認証で引くため、ランナーの
      # 共有 IP がレートリミットに当たると
      # `Github rate-limiter failed the request.` で job ごと落ちる（#157）。
      # releases/download/ は API ではなく単なるリダイレクトなので当たらない。
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c -
          tar xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/

      # -kubernetes-version を付けないと上流 master のスキーマで検証してしまい、
      # 本番の k3s とズレる。Pi は k3s v1.34.6+k3s1。
      - name: Build and validate manifests
        run: |
          kustomize build k8s/ > /tmp/rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.34.0 /tmp/rendered.yaml

      # kustomization に含めない db-seed も構文だけは検証する
      - name: Validate db-seed job
        run: kubeconform -strict -summary -kubernetes-version 1.34.0 k8s/job-db-seed.yaml

      # configMapGenerator の書き間違いは静かに壊れる（#133）。
      # `envs:` を `files:` と書くと「キーがファイル名、値が全文」の ConfigMap が
      # でき、envFrom はそれを不正な変数名として捨てるため、環境変数が全部消えた
      # Pod が正常に起動する。ConfigMap としては妥当なので kubeconform も通るし、
      # deploy.yml のスモークが見る /healthz と /login も 200 を返す。
      # disableNameSuffixHash を足した場合も、固定名に戻って無反映が復活するだけで
      # 何も落ちない。yq を足すと #157 と競合するので grep だけで確かめる。
      - name: Ensure ConfigMap is generated correctly
        run: |
          set -euo pipefail

          # 生成名にハッシュ接尾辞が付いていること（generator が効いている証拠）。
          # `|| true` が要る。grep は一致しないと exit 1 を返し、set -e のもとでは
          # 代入の時点でスクリプトが死ぬため、下の ::error:: に到達せず
          # 「exit code 1」だけがログに残る（＝一番見たいメッセージが出ない）
          #
          # kustomize のハッシュ接尾辞は10文字。`+` にすると `-prod` のような手で付けた
          # 接尾辞もハッシュとして通ってしまう（#172）
          generated=$(grep -oE '^  name: fishing-app-config-[a-z0-9]{10}$' /tmp/rendered.yaml \
            | head -1 | awk '{print $2}' || true)
          if [ -z "$generated" ]; then
            echo "::error::fishing-app-config-<10文字のハッシュ> という ConfigMap が無い。configMapGenerator の name の変更か disableNameSuffixHash を確認"
            exit 1
          fi

          # Deployment の configMapRef がその生成名を指していること。
          # `configMapRef:` の直後の行だけを見る。ファイル全体を探すと ConfigMap 自身の
          # metadata.name に一致して常に通り、configMapRef を消しても素通りした（#172）。
          # grep -q にパイプで渡すと、早く抜けたときの SIGPIPE が pipefail で失敗扱いに
          # なりうるので、いったん変数に入れる。
          #
          # 前提: 生成名を参照する configMapRef は Deployment の唯一のコンテナにしか無い。
          # rendered.yaml 全体のどこかに参照があれば通るので、サイドカーや initContainer、
          # Job に同じ参照を足したうえで本体から消すと素通りする。コンテナを増やすときは
          # Deployment の文書だけを切り出して見るよう直すこと
          refs=$(grep -A1 -E '^ +- configMapRef:$' /tmp/rendered.yaml || true)
          if ! grep -qE "^ +name: ${generated}$" <<<"$refs"; then
            echo "::error::Deployment が configMapRef で ${generated} を参照していない（configMapRef が無い、名前が違う、deployment.yaml が resources に無い、のいずれか）"
            exit 1
          fi

          # 環境変数が個別のキーとして入っていること。
          # envs: ではなく files: で取り込むと `config.env:` という1キーになる
          for key in NODE_ENV LOG_LEVEL AUTH_URL NEXTAUTH_URL AUTH_TRUST_HOST REDIS_URL; do
            if ! grep -qE "^  ${key}: " /tmp/rendered.yaml; then
              echo "::error::ConfigMap に ${key} が無い。config.env の取り込み方（envs:）を確認"
              exit 1
            fi
          done

          # AUTH_URL は消えても画面が壊れず、セッション Cookie の __Host- と
          # Secure が静かに外れる（#134）。https で始まることまで見る
          if ! grep -qE '^  AUTH_URL: https://' /tmp/rendered.yaml; then
            echo "::error::AUTH_URL が https:// で始まっていない。Cookie の Secure 属性が外れる"
            exit 1
          fi

      # probe は /healthz だけを指すこと。DB を叩く probe は Neon の autosuspend を
      # 永久にリセットし、無料枠を使い切って本番を落とす（#187、経緯は k8s/README.md）。
      - name: Ensure probes only hit /healthz
        run: |
          # 各 probe のブロックの中だけを見る。ファイル全体だと Ingress の path にも一致する。
          # 行数でなくインデントで切る。kustomize はキーを辞書順に並べるので、httpHeaders や
          # host があると path が後ろにずれ、固定の行数では取りこぼす。
          # 1行にまとめる。::error:: は改行で切れるので、複数行だと犯人の path が表示されない
          paths=$(awk '
            /^ +(startup|liveness|readiness)Probe:$/ { ind = match($0, /[^ ]/); inp = 1; next }
            inp && match($0, /[^ ]/) <= ind { inp = 0 }
            inp && /^ +path: / { print $2 }
          ' /tmp/rendered.yaml | sort -u | paste -sd, -)

          # 禁止リストではなく許可リスト。DB を叩く新しいエンドポイントを足しても自動で落ちる
          if [ "$paths" != "/healthz" ]; then
            echo "::error::probe は /healthz だけを指すこと（#187）。見つかった path: ${paths:-なし}"
            exit 1
          fi

      - name: Ensure no Secret is rendered
        run: |
          if grep -q "^kind: Secret" /tmp/rendered.yaml; then
            echo "::error::secret.enc.yaml が kustomization に含まれている。暗号文が適用される事故になる"
            exit 1
          fi

      # secret.enc.yaml はどのステップも触らないため、`sops -d > secret.enc.yaml`
      # のような取り違えで平文がコミットされても CI が無言で緑になる。
      # .gitignore は secret.yaml しか守らないので、ここで明示的に確かめる。
      - name: Ensure secret.enc.yaml is actually encrypted
        run: |
          if ! grep -q "^sops:" k8s/secret.enc.yaml; then
            echo "::error::k8s/secret.enc.yaml に sops メタデータが無い。暗号化されていない可能性がある"
            exit 1
          fi
          plain=$(awk '/^stringData:/{f=1;next} /^[a-z]/{f=0} f && /: / && !/ENC\[AES256_GCM/' k8s/secret.enc.yaml)
          if [ -n "$plain" ]; then
            echo "::error::k8s/secret.enc.yaml の stringData に暗号化されていない値がある"
            # 行ごとに伏せる。${plain//:*/} だと * が改行をまたいで2行目以降のキー名まで消える
            # shellcheck disable=SC2001
            echo "$plain" | sed 's/:.*/: <伏せ字>/'
            exit 1
          fi

  # ============================================
  # Docker イメージのビルド検証
  # ============================================
  # イメージをビルドするのは deploy.yml だけで、main への push でしか走らない。
  # そのため Dockerfile のビルド時チェック（migrator の import 解決 #201、
  # prune 後の prisma.config.ts 読み込み、`# check=error=true`）が main に
  # マージしたあとの deploy で初めて働いていた（#207）。PR の時点でビルドだけする。
  #
  # push しないのでレジストリの権限も secrets も要らない。NEXT_PUBLIC_* の
  # build-arg は空のまま（埋め込まれるだけでビルドの成否には関わらない）。
  # ランナーは本番と同じ arm64（public リポジトリでは無料）。alpine 上の
  # ネイティブモジュール（bcrypt など）の取得はアーキテクチャごとに違う。
  # runner は builder ステージを migrator と共有するので、続けてビルドすれば
  # ほぼキャッシュで済む。
  docker:
    name: Docker Images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build migrator image
        run: docker build --file docker/Dockerfile --target migrator .

      - name: Build runner image
        run: docker build --file docker/Dockerfile --target runner .

  # ============================================
  # CIサマリー
  # ============================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality-check, build, manifests, docker]
    if: always() # 失敗してもサマリーは表示

    steps:
      - name: Check CI results
        run: |
          {
            echo "## CI Results"
            echo ""

            if [ "${{ needs.quality-check.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.manifests.result }}" == "success" ] && [ "${{ needs.docker.result }}" == "success" ]; then
              echo "🟢 All checks passed!"
              echo ""
              echo "- 🟢 Code Quality Check"
              echo "- 🟢 Build Verification"
              echo "- 🟢 Kubernetes Manifests"
              echo "- 🟢 Docker Images"
            else
              echo "❌ Some checks failed"
              echo ""
              echo "- ${{ needs.quality-check.result == 'success' && '🟢' || '❌' }} Code Quality Check"
              echo "- ${{ needs.build.result == 'success' && '🟢' || '❌' }} Build Verification"
              echo "- ${{ needs.manifests.result == 'success' && '🟢' || '❌' }} Kubernetes Manifests"
              echo "- ${{ needs.docker.result == 'success' && '🟢' || '❌' }} Docker Images"
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"