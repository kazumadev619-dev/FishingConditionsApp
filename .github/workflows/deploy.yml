name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# デプロイは絶対に途中で殺さない。マイグレーション実行中に中断されると
# _prisma_migrations に failed レコードが残り、以後の migrate deploy が
# すべて止まる（prisma migrate resolve の手動介入が必要になる）
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_APP: ghcr.io/kazumadev619-dev/fishing-app
  IMAGE_MIGRATOR: ghcr.io/kazumadev619-dev/fishing-app-migrator
  NAMESPACE: fishing
  BASE_URL: https://fishing.kazuma-lab.com
  # sops のリリースアセットはファイル名にバージョンが入るため
  # releases/latest/download/ が使えない。明示的に固定する
  SOPS_VERSION: v3.13.3
  # *_SHA256 は各リリースが公開しているチェックサムファイルの linux amd64 の値。
  # 版を上げるときは一緒に書き換える（#164）
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
  # 本番マニフェストをレンダリングするツール。ci.yml と同じ版に揃える。
  # ズレると「CI では通るが本番で出力が変わる」が起こりうる（#157）
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  # ローカルで YAML を切り出すだけなので、版を固定して出力を安定させる
  YQ_VERSION: v4.48.1
  YQ_SHA256: 99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f

jobs:
  # ============================================
  # arm64 イメージのビルドと push
  # ============================================
  build:
    name: Build arm64 images
    # public リポジトリでは arm64 ホストランナーが無料で使える。
    # QEMU を挟まないので Next.js のビルドが現実的な時間で終わる
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest は決して push しない。set image を忘れた apply が
      # :latest を解決してしまうと古いコードが本番に出るため、
      # 存在しないタグにして ImagePullBackOff で安全側に倒す
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_APP }}:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_MIGRATOR }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

  # ============================================
  # k3s へのデプロイ
  # ============================================
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          # 上流の install_kustomize.sh は使わない。GitHub の releases API を
          # 未認証で引くためレートリミットに当たると落ちるうえ、引数を渡さないと
          # 最新版が入る。本番マニフェストのレンダリングに使うツールが未固定だと
          # 上流のリリースだけでレビューを経ずに出力が変わる（#157）
          # 取得したものは展開・インストールの前にチェックサムを照合する（#164）
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c -
          tar xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          curl -fsSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /tmp/sops
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          # cloudflared は latest 追従なので固定のチェックサムは持てない。
          # 代わりに入った版をログに残す（下の cloudflared --version）
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          # yq は ubuntu ランナーに同梱されているが、イメージ更新で消えても
          # 気づけるようにフォールバックを置く
          command -v yq >/dev/null || {
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
            echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
            sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          }
          kustomize version
          sops --version
          yq --version
          cloudflared --version

      - name: Set up kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # cloudflared は CF_ACCESS_* という環境変数を読まない。
      # 正しくは TUNNEL_SERVICE_TOKEN_ID / TUNNEL_SERVICE_TOKEN_SECRET
      - name: Open tunnel to kube-apiserver
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cloudflared access tcp --hostname k8s.kazuma-lab.com --url 127.0.0.1:6443 &
          timeout 30 bash -c 'until nc -z 127.0.0.1 6443; do sleep 1; done'
          # ci-deployer の Role は fishing 名前空間限定で ClusterRole は無い。
          # `get nodes` はクラスタスコープなので必ず Forbidden になる。
          # 疎通確認は名前空間内のリソースで行うこと
          kubectl -n "$NAMESPACE" get pods

      # ci-deployer の Role は secrets に resourceNames を付けている。
      # resourceNames は create には効かない（認可時点で名前が未確定のため）ので、
      # Secret の新規作成はできない。初回だけ管理者権限で作成済みであり、
      # ここは既存 Secret への patch として通る。詳細は fishing-infra#1
      - name: Apply secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          sops -d k8s/secret.enc.yaml | kubectl apply -f - > /dev/null
          echo "secret applied"

      - name: Render manifests
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # Secret が変わっても Pod は再起動しない（envFrom は起動時にしか
          # 解決されない）。チェックサムを Pod テンプレートに載せて
          # ローテーション時に確実にロールアウトさせる
          SECRET_HASH=$(sops -d k8s/secret.enc.yaml | sha256sum | cut -c1-16)
          cd k8s
          kustomize edit set image \
            "${IMAGE_APP}=${IMAGE_APP}:${TAG}" \
            "${IMAGE_MIGRATOR}=${IMAGE_MIGRATOR}:${TAG}"
          kustomize edit add annotation --force "secret-checksum:${SECRET_HASH}"
          kustomize build . > "$RUNNER_TEMP/rendered.yaml"
          grep -c "^kind:" "$RUNNER_TEMP/rendered.yaml"

      # どちらも必ず rollout より先。失敗したらロールアウトせず、旧 Pod はそのまま残る。
      # db-check: アプリが使う pooled 側の DATABASE_URL に繋がるか（#191）。readiness は
      #   DB を見ない（#187）ので、ここで止めないと壊れた Secret のまま旧 Pod が消え、
      #   rollout undo でも戻らない。migrate より先に流し、schema だけ進むこともなくす
      # db-migrate: DATABASE_URL_DIRECT で prisma migrate deploy
      - name: Run pre-rollout jobs
        run: |
          set -euo pipefail
          # 引数: Job 名 / 待つ秒数（その Job の activeDeadlineSeconds + 60）
          run_job() {
            local job=$1 limit=$2 conds
            local deadline=$(( SECONDS + limit ))
            kubectl -n "$NAMESPACE" delete job "$job" --ignore-not-found
            JOB="$job" yq 'select(.kind == "Job" and .metadata.name == strenv(JOB))' \
              "$RUNNER_TEMP/rendered.yaml" | kubectl apply -f -
            # `kubectl wait --for=condition=complete` は Failed を検知せず
            # timeout まで待ち続ける。Job 側は backoffLimit: 0 /
            # activeDeadlineSeconds で失敗が数十秒で確定するので、
            # complete と failed の両方をポーリングして即座に打ち切る
            while [ "$SECONDS" -lt "$deadline" ]; do
              conds=$(kubectl -n "$NAMESPACE" get job "$job" \
                -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
              case " $conds " in
                *" Complete "*)
                  echo "$job completed"
                  kubectl -n "$NAMESPACE" logs "job/$job" --tail=50
                  return 0
                  ;;
                *" Failed "*)
                  echo "$job failed (conditions: $conds)"
                  kubectl -n "$NAMESPACE" logs "job/$job" --tail=200
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "$job timed out after ${limit}s"
            kubectl -n "$NAMESPACE" logs "job/$job" --tail=200
            return 1
          }
          run_job db-check 360
          run_job db-migrate 660

      - name: Apply manifests
        id: apply
        run: |
          set -euo pipefail
          # 失敗したときの戻り先。初回デプロイで Deployment が無ければ空になり、Rollback は走らない
          rev=$(kubectl -n "$NAMESPACE" get deploy/fishing-app --ignore-not-found \
            -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          kubectl apply -f "$RUNNER_TEMP/rendered.yaml"
          kubectl -n "$NAMESPACE" rollout status deploy/fishing-app --timeout=300s

      # ブロッキングなスモークは外部 API に依存しないパスのみ。
      # / は潮汐 API が落ちているだけで 500 になるため非ブロッキングにする
      - name: Smoke test (blocking)
        run: |
          set -euo pipefail
          curl -fsS "${BASE_URL}/healthz" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null -w "login: %{http_code}\n" "${BASE_URL}/login"
          # readiness は DB を見ない（#187）ので、壊れた DATABASE_URL でもロールアウトは
          # 緑で終わる。ここで1回だけ DB 到達性を確かめる。直前の migrate で compute は
          # 起きており、1回きりなので Neon の autosuspend も妨げない。
          # 本文は非ブロッキングのスモークが cache の状態を読むので残す（2回叩かない）
          curl -fsS "${BASE_URL}/readyz" | tee "$RUNNER_TEMP/readyz.json" /dev/stderr | grep -q '"database":"ok"'
          # 既定 deny（#129）が外れていたら、外部 API のクォータと DB が第三者に開く。
          # 保護対象の API は代表の1本だけ見る。残りは非ブロッキングで記録する
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${BASE_URL}/api/ports")
          echo "unauthenticated /api/ports: ${code}"
          if [ "$code" != 401 ]; then
            echo "::error::未認証の /api/ports が ${code} を返した（401 のはず）"
            exit 1
          fi
          # AUTH_URL がずれると本番のログインが壊れ、Cookie の Secure も静かに外れる（#134）
          expected="${BASE_URL}/api/auth/callback/google"
          callback=$(curl -fsS "${BASE_URL}/api/auth/providers" | yq -p json '.google.callbackUrl')
          echo "google callbackUrl: ${callback}"
          if [ "$callback" != "$expected" ]; then
            echo "::error::google の callbackUrl が ${callback}（${expected} のはず）"
            exit 1
          fi

      # 壊れても画面は動く種類の退行を記録する。NG があれば warning を出す
      - name: Smoke test (non-blocking)
        continue-on-error: true
        run: |
          # Actions の既定は bash -e。判定は row にコマンドで渡し、偽でもステップを止めない
          set -o pipefail
          ng=0
          status() { curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}$1"; }
          # $1: 見出し / $2: 実際の値 / 残り: OK なら真になるコマンド
          row() {
            local label=$1 value=$2
            shift 2
            if "$@"; then echo "- ${label} → ${value}"; else echo "- ${label} → ${value} **NG**"; ng=1; fi
          }
          {
            echo "## 非ブロッキングスモーク"
            for p in / /dashboard; do
              echo "- \`${p}\` → $(status "$p")"
            done

            echo "### 未認証の保護対象 API（401 のはず。#129）"
            for p in /api/weather /api/scores /api/conditions/tide /api/locations/search /api/favorites; do
              code=$(status "$p")
              row "\`${p}\`" "$code" test "$code" = 401
            done

            # 除外パターンが境界で切れていないと、似た名前の別パスが proxy を素通りする。
            # 素通りすると 404 になるので「200 以外」では見分けられない。proxy を通った
            # 証拠（ページはログインへの 307、API は 401）で判定する
            echo "### matcher の境界（proxy を通って 307 / 401 のはず）"
            for p in /healthz-debug /_next/static-evil /faviconZico /api/authenticate; do
              code=$(status "$p")
              case "$p" in /api/*) want=401 ;; *) want=307 ;; esac
              row "\`${p}\`" "$code" test "$code" = "$want"
            done

            echo "### セキュリティヘッダ（\`/login\`。#134）"
            headers=$(curl -s -o /dev/null -D - "${BASE_URL}/login")
            for h in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options \
                     X-Frame-Options Referrer-Policy Permissions-Policy Cross-Origin-Opener-Policy; do
              grep -qi "^${h}:" <<<"$headers" && v=あり || v=無い
              row "$h" "$v" test "$v" = あり
            done

            # degraded でも readiness は通る（意図的）ので、ここで気づけるようにする
            echo "### /readyz"
            cache=$(yq -p json '.checks.cache' < "$RUNNER_TEMP/readyz.json")
            row cache "$cache" test "$cache" = ok

            # #133。rollout undo の戻り先（履歴に残る ReplicaSet。現行のものを含む）が
            # 参照する ConfigMap は消えていてはいけない。生成名にハッシュが付くことは
            # ci.yml がレンダリング結果で見ている
            echo "### ConfigMap（#133）"
            refs=$(kubectl -n "$NAMESPACE" get rs -l app.kubernetes.io/name=fishing-app \
              -o jsonpath='{range .items[*]}{.spec.template.spec.containers[*].envFrom[*].configMapRef.name}{"\n"}{end}' \
              | sort -u) || refs=
            row "ReplicaSet が参照する ConfigMap" "${refs//$'\n'/ }" test -n "$refs"
            for cm in $refs; do
              kubectl -n "$NAMESPACE" get configmap "$cm" -o name >/dev/null 2>&1 && v=ある || v=無い
              row "\`${cm}\`" "$v" test "$v" = ある
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ng" -ne 0 ]; then
            echo "::warning::非ブロッキングスモークに NG がある（Summary を参照）"
          fi

      # ログを先に吸い出す。undo すると手がかりが消える
      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" logs job/db-check --tail=100 || true
          kubectl -n "$NAMESPACE" logs job/db-migrate --tail=100 || true
          kubectl -n "$NAMESPACE" describe deploy/fishing-app || true
          kubectl -n "$NAMESPACE" logs deploy/fishing-app --tail=100 || true

      # 引数なしの undo は「この run で新しいリビジョンができたか」を見ずに1つ前へ戻す。
      # migrate の失敗で Apply が skip されたときや Deployment が apply で拒否されたときも、
      # 動いているリビジョンを巻き戻してしまう（#190）。Apply の前に記録したリビジョンを
      # 指定すれば、新しいリビジョンが無いときは skipped rollback で何もしない
      - name: Rollback on failure
        if: failure() && steps.apply.outputs.revision != ''
        env:
          REVISION: ${{ steps.apply.outputs.revision }}
        run: |
          kubectl -n "$NAMESPACE" rollout undo deploy/fishing-app --to-revision="$REVISION" || true
          kubectl -n "$NAMESPACE" rollout status deploy/fishing-app --timeout=180s || true
