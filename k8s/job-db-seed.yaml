# 初回のみ手動で実行する（kustomization の resources には含めない）:
#   kubectl apply -f k8s/job-db-seed.yaml
#   kubectl -n fishing logs -f job/db-seed
# 再実行する場合は先に削除:
#   kubectl -n fishing delete job db-seed
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: fishing
  labels:
    app.kubernetes.io/name: db-seed
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-seed
          # タグは kustomize の images[].newTag が CI で埋める
          image: ghcr.io/kazumadev619-dev/fishing-app-migrator
          command:
            - /bin/sh
            - -c
            - |
              set -e
              node --import tsx/esm prisma/seed.ts
          # prisma/seed.ts は Prisma CLI を通さず process.env.DATABASE_URL から
          # 自前で pg.Pool を作る。読むのは DATABASE_URL だけ（DDL は無く、
          # ports への INSERT ... ON CONFLICT DO UPDATE のみ）なので、
          # アプリロール fishing_app_rw の direct 接続を渡す。
          # 座標は prisma/data/port-coordinates.csv から入れ、外部 API は呼ばない（#345）。
          # オーナー（DATABASE_URL_DIRECT）は渡さない（#135）。
          # direct なのは pooled では seed の一括投入が PgBouncer 経由で詰まるため。
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fishing-app-secret
                  key: DATABASE_URL_RW_DIRECT
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
