# SOPS configuration for Kubernetes secrets encryption
# https://github.com/getsops/sops
#
# セットアップ手順:
# 1. brew install sops age
# 2. age-keygen -o ~/.config/sops/age/keys.txt
# 3. 生成された公開鍵をこのファイルの age: に設定
# 4. sops -e secret.yaml > secret.enc.yaml で暗号化

creation_rules:
  # ローカル環境用（開発者のage鍵で暗号化）
  - path_regex: overlays/local/.*secret.*\.yaml$
    age: age1wwpnls59pm7a542w3s4le2sgrcqpvtxtchxumdl4qhwph4xu25wqpqjxpn

  # 本番環境用（AWS KMSで暗号化）
  - path_regex: overlays/production/.*secret.*\.yaml$
    kms: arn:aws:kms:ap-northeast-1:ACCOUNT_ID:key/KEY_ID
    # ↑ EKS移行時にAWS KMSのARNに置き換える
