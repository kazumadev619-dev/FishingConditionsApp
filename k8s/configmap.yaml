apiVersion: v1
kind: ConfigMap
metadata:
  name: fishing-app-config
  namespace: fishing-app
  labels:
    app.kubernetes.io/name: fishing-app
data:
  NODE_ENV: "production"
  # Auth.js URLs（overlaysで上書き）
  AUTH_URL: "http://localhost:3000"
  NEXTAUTH_URL: "http://localhost:3000"
  # Redis（K8sクラスター内）
  REDIS_URL: "redis://redis:6379"
