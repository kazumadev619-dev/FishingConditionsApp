apiVersion: v1
kind: Secret
metadata:
  name: fishing-app-secret
  namespace: fishing-app
  labels:
    app.kubernetes.io/name: fishing-app
type: Opaque
stringData:
  # 実際の値はoverlaysで上書き（SOPS暗号化推奨）

  # Database
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/fishing_app"

  # Auth.js
  AUTH_SECRET: "your-auth-secret-at-least-32-chars"

  # Google OAuth
  AUTH_GOOGLE_ID: ""
  AUTH_GOOGLE_SECRET: ""

  # External APIs
  OPENWEATHERMAP_API_KEY: ""
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
  NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ""

  # Email Service (Resend)
  RESEND_API_KEY: ""
  EMAIL_FROM: "noreply@example.com"
