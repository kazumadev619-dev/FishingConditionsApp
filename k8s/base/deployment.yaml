apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishing-app
  namespace: fishing-app
  labels:
    app.kubernetes.io/name: fishing-app
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fishing-app
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishing-app
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: fishing-app
          image: fishing-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fishing-app-config
            - secretRef:
                name: fishing-app-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # probe は必ず /healthz を使う。/ は潮汐・天気の外部 API に依存するため、
          # 外部要因の障害で健全な Pod が再起動ループに入る（k8s はイメージの
          # HEALTHCHECK を読まないので、probe を直さない限りこの経路は塞がらない）。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # NOTE: /healthz は依存ゼロのため「プロセスが生きている」ことしか判定できない。
          # DB/Redis 未接続の Pod も Ready になる点は既知で、依存を見る readiness 用
          # エンドポイントの追加は後続対応とする（/ に戻すのは上記の理由で不可）。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
