# DB初期化Job（migrate + seed + 座標更新）
#
# 使い方:
#   kubectl apply -f db-init-job.yaml
#   kubectl logs -f job/db-init -n fishing-app
#
# 再実行する場合は先に削除:
#   kubectl delete job db-init -n fishing-app
#
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: fishing-app
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: fishing-app:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== DB Init Job Started ==="

              echo ""
              echo "1/3: Running Prisma migrations..."
              npx prisma migrate deploy
              echo "🟢 Migrations completed!"

              echo ""
              echo "2/3: Running database seed..."
              npx prisma db seed
              echo "🟢 Seed completed!"

              echo ""
              echo "3/3: Updating port coordinates from external API..."
              echo "    (This may take a few minutes...)"
              npx tsx scripts/update-port-coordinates.ts || echo "⚠️ Coordinate update had some failures (non-critical)"

              echo ""
              echo "=== DB Init Job Completed ==="
          envFrom:
            - configMapRef:
                name: fishing-app-config
            - secretRef:
                name: fishing-app-secret
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
