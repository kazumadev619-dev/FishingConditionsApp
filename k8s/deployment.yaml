apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishing-app
  namespace: fishing
  labels:
    app.kubernetes.io/name: fishing-app
    app.kubernetes.io/component: web
spec:
  # 単一ノードなので replicas を増やしても可用性は上がらない。
  # 無停止更新は maxSurge/maxUnavailable で担保する。
  replicas: 1
  # rollout status の --timeout=300s より短くして、
  # timeout ではなく ProgressDeadlineExceeded という明示的な失敗にする
  progressDeadlineSeconds: 240
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fishing-app
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishing-app
        app.kubernetes.io/component: web
    spec:
      # このアプリは k8s API を使わない
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fishing-app
          # タグは kustomize の images[].newTag が CI で埋める
          image: ghcr.io/kazumadev619-dev/fishing-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fishing-app-config
            - secretRef:
                name: fishing-app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # maxUnavailable: 0 なので新 Pod が Ready になった直後に旧 Pod へ
          # SIGTERM が飛ぶ。Traefik が EndpointSlice の更新を受け取るまでの
          # 数百 ms に振られたリクエストが切れるため、その分だけ待たせる。
          # Next 16.3.1 の server.js は SIGTERM ハンドラを持たず即死する
          # （実測 ExitCode 143 / 0.12 秒。16.0.10 では 0 だった）ので、
          # アプリ側の graceful shutdown には頼れない。
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # CPU limit は付けない。CFS quota として効くため、負荷試験では
              # throttle 由来のスパイクが p99 を支配し「設定値」を測ることになる
              memory: "512Mi"
          # arm64 の Pi では起動が遅い。startupProbe が成功するまで
          # liveness/readiness は無効化されるので、初回 CrashLoop を防げる。
          # 最大 5s × 30 = 150s まで待つ。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # liveness は必ず /healthz を使う。/ は潮汐・天気の外部 API に依存するため、
          # 外部要因の障害で健全な Pod が再起動ループに入る（k8s はイメージの
          # HEALTHCHECK を読まないので、probe を直さない限りこの経路は塞がらない）。
          # /healthz は依存ゼロで「プロセスが生きているか」だけを見る。
          # initialDelaySeconds は startupProbe が肩代わりするので置かない。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # readiness は DB 到達性を見る /readyz を使う。/healthz だと DB 未接続の
          # Pod も Ready になり、Service が流したトラフィックが全て 500 になる。
          # Redis は判定に含めない（落ちてもキャッシュ素通しで動くため。含めると
          # クラスタ全体の Redis 障害で全 Pod が NotReady になる）。
          # timeoutSeconds はアプリ側の DB チェック打ち切り（3秒）より長くする。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem のため、書き込みが必要な場所だけ emptyDir を当てる。
        # sizeLimit を付けるのは、fishing-infra の ResourceQuota が
        # ephemeral-storage を見ていないため。単一ノードなので、ここが膨らんで
        # DiskPressure になると同じノードの cloudflared まで巻き込む
        # （= クラスタへの到達性を失う）。
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
