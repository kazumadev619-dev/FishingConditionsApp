apiVersion: batch/v1
kind: Job
metadata:
  name: db-check
  namespace: fishing
  labels:
    app.kubernetes.io/name: db-check
    app.kubernetes.io/component: preflight
# アプリが使う pooled 側の DATABASE_URL で SELECT 1 を1回だけ投げる（#191）。
# readiness は DB を見ない（#187）ので、壊れた DATABASE_URL でもロールアウトは完了し、
# 旧 Pod が消えてから気づくことになる。rollout undo でも Secret 起因の障害は直らない。
# deploy.yml が Apply manifests の前にこの Job を流し、失敗したら旧 Pod を残したまま止める。
# デプロイごとに1回なので Neon の autosuspend は妨げない。
spec:
  backoffLimit: 0
  # startTime 起点なので、新しいタグの app イメージを Pi で pull する時間も含む
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-check
          # アプリと同じイメージ・同じドライバ（pg）で繋ぐ。sslmode の解釈はドライバで
          # 違う（ADR-004）ので、psql や Prisma CLI で確かめても同じ結果になるとは限らない。
          # タグは kustomize の images[].newTag が CI で埋める
          image: ghcr.io/kazumadev619-dev/fishing-app
          # ログに接続文字列の一部（ホスト名・ユーザー名）が出ないよう、失敗時は
          # エラーコードだけを出す。ponytail: 原因の詳細が要るときは手元で同じ URL を試す
          # /app/package.json は "type": "module" だが、-e は CommonJS で評価されるので require が使える
          # （ファイルにして node で実行すると ESM 扱いで落ちる）
          command:
            - node
            - -e
            - |
              const { Client } = require('pg');
              if (!process.env.DATABASE_URL) {
                console.error('db-check: DATABASE_URL is empty');
                process.exit(1);
              }
              const c = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 30000 });
              c.connect()
                .then(() => c.query('SELECT 1'))
                .then(() => c.end())
                .then(() => console.log('db-check: SELECT 1 ok'))
                .catch((e) => {
                  console.error(`db-check: failed (${e.code ?? e.constructor.name})`);
                  process.exit(1);
                });
          # envFrom は付けない。db-migrate と同じく Apply manifests より前に流すので
          # ConfigMap はまだ無く、生成名も内容ごとに変わる（job-db-migrate.yaml 参照）
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fishing-app-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
