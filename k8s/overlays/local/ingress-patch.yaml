apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fishing-app
  namespace: fishing-app
spec:
  rules:
    - host: fishing-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fishing-app
                port:
                  name: http
