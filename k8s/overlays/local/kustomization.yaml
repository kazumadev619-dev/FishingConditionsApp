apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fishing-app

resources:
  - ../../base

# ローカル開発用のパッチ
patches:
  - path: ingress-patch.yaml
  - path: deployment-patch.yaml

# ksopsでSOPS暗号化ファイルを復号化
generators:
  - secret-generator.yaml

# ローカル用のConfigMap上書き
configMapGenerator:
  - name: fishing-app-config
    behavior: merge
    literals:
      - AUTH_URL=http://localhost:3001
      - NEXTAUTH_URL=http://localhost:3001
