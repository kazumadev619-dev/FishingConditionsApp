apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishing-app
  namespace: fishing-app
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: fishing-app
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
