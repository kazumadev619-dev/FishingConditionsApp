apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fishing-app

resources:
  - ../../base

# 本番用パッチ
patches:
  - path: ingress-patch.yaml
  - path: deployment-patch.yaml

# 本番用ConfigMap（ドメインは環境に応じて変更）
configMapGenerator:
  - name: fishing-app-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - AUTH_URL=https://kazuma-lab.com
      - NEXTAUTH_URL=https://kazuma-lab.com

# イメージタグは実際のGCRイメージに変更
images:
  - name: fishing-app
    newName: gcr.io/YOUR_PROJECT_ID/fishing-app
    newTag: latest
