apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: fishing
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
spec:
  # kubectl wait --for=condition=complete は Job の Failed を検知せず
  # timeout まで待つ。backoffLimit 0 + activeDeadlineSeconds で早期に確定させる
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          # タグは kustomize の images[].newTag が CI で埋める
          image: ghcr.io/kazumadev619-dev/fishing-app-migrator
          # npx は $HOME/.npm に書こうとし、見つからなければネットワーク取得を
          # 試みる。マイグレーションでそのリスクを取る理由が無いので直接叩く
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          # envFrom: configMapRef は付けない。初回デプロイ時点で ConfigMap が
          # まだ存在せず CreateContainerConfigError で 5 分待たされるため。
          # prisma.config.ts が読むのは DATABASE_URL_DIRECT だけでよい。
          env:
            - name: DATABASE_URL_DIRECT
              valueFrom:
                secretKeyRef:
                  name: fishing-app-secret
                  key: DATABASE_URL_DIRECT
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
