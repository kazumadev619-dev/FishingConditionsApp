# E2E 用の Postgres と Redis（docs/guides/e2e-env.md）。worktree ごとに別のプロジェクト名（-p）で立てる。
# ホスト側のポートは Docker に割り当てさせるので、並行して立てても衝突しない。up.sh がポートを引いて .e2e/state.env に書く。
# 本番・ローカル開発（docker/docker-compose.yml）の DB・Redis・ボリュームには触れない。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d e2e']
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1::6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
